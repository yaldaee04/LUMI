<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جزئیات محصولات | LUMI</title>

    <link rel="stylesheet" href="css/styles.css">

</head>

<body>

    <header>
        <!--منوی سایت-->
    </header>

    <main>
        <section class="product-detail">

            <div id="product-info">

            </div>
        </section>
    </main>

    <footer class="footer">
        <!--اطلاعات پایین صفحه-->
        <div class="footer-container">

            <div class="footer-about">
                <h2>LUMI</h2>
                <P>
                    زیبایی،در سادگی معنا پیدا میکند .
                </P>
            </div>

            <div class="footer-links">
                <h3>راهنمای مشتریان</h3>
                <a href="#">درباره ما</a>
                <a href="#">تماس باما</a>
                <a href="#">سوالات متداول</a>
            </div>


        </div>

        <div class="footer-buttom">
            <p>© 2026 LUMI. All rights reserved.</p>
        </div>

    </footer>
    <!--cart drawer-->

    <div class="cart-overlay"></div>

    <div class="cart-sidebar">

        <div class="cart-header">
            <h2>سبد خرید من</h2>
            <button class="close-cart" onclick="closeCart()">×</button>
        </div>

        <div class="cart-items">
            <!--محصولات سبد خرید اینجا نمایش داده میشن-->
        </div>

        <div class="cart-footer">
            <h3>مجموع:<span class="cart-total">۰</span>تومان</h3>
            <button class="checkout-btn" onclick="goToCheckout()">
                تکمیل سفارش
            </button>
        </div>

    </div>

    <script src="js/scripts.js"></script>
</body>

</html>
